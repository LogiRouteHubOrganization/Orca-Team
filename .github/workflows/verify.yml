name: CI Verification Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Find and Build Gradle Project
        run: |
          PROJECT_DIR=$(find . -maxdepth 2 -name "build.gradle.kts" -exec dirname {} \;)
          if [ -n "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"
            chmod +x gradlew 2>/dev/null || true
            if [ -f "./gradlew" ]; then
              ./gradlew test
            else
              gradle test
            fi
          else
            exit 1
          fi